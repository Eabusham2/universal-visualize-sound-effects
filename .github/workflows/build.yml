name: Build SoundOverlay

on:
  push:
    branches: [main, master, "claude/*"]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64 make file

      # The FFT core is plain C: verify it natively before cross-compiling.
      - name: Unit tests (host)
        run: make test

      - name: Build SoundOverlay.exe
        run: make CC=x86_64-w64-mingw32-gcc WINDRES=x86_64-w64-mingw32-windres

      - name: Verify binary
        run: |
          file SoundOverlay.exe
          file SoundOverlay.exe | grep -q "PE32+ executable (GUI) x86-64"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundOverlay
          path: SoundOverlay.exe
          retention-days: 90
          if-no-files-found: error

  # Validate the MSVC path (build.bat) too, so both documented builds stay green.
  msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build with build.bat
        shell: cmd
        run: build.bat
      - uses: actions/upload-artifact@v4
        with:
          name: SoundOverlay-msvc
          path: build/SoundOverlay.exe
          if-no-files-found: error

  # Pushing a tag like v1.1.0 creates a GitHub Release with the exe
  # attached, giving a permanent download link (artifacts expire).
  release:
    needs: [build, msvc]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SoundOverlay
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" SoundOverlay.exe \
            --repo "${GITHUB_REPOSITORY}" \
            --title "SoundOverlay ${GITHUB_REF_NAME}" \
            --generate-notes
